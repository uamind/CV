- type: projects
  name: 项目
  content:
  - title: API端点和数据采集框架
    duration: 2025年10月 - 2026年3月
    # summary: 数据采集和API端点具有流控和权限管理, 自动化生成对应的增删改查API端点。
    # detail:
    #   md: _data/api.md
    items:
    - 核心开发：使用 **FastAPI** 异步框架开发，支持高并发环境下的数据采集与接口分发。
    - 自动化 ORM：实现根据数据库表自动生成 **SQLModel** 模型及标准化 RESTAPI 接口的底层逻辑。
    - 采集引擎：深度封装 **Httpx / PyHttpx**，支持同步/异步双模式切换及自动重试和指数级回避策略。
    - 逆向攻防：利用 **Playwright** 模拟浏览器环境，解决动态加密与设备指纹识别等反爬难题。
    - 系统保障：集成 **JWT** 身份认证与流控插件，构建安全可控的数据中台。
    sub: 刘登

  - title: 直播采集
    duration: 2025年1月 - 2025年3月
    # detail: 这是一个抖音直播分析软件，可以监控直播数据并查看观众信息，支持百万级的观众并发。 GUI使用PySide开发, 支持Mac/Windows/Linux项目地址:https://github.com/uamind/douyinLiveSpider
    items:
    - 高并发架构：针对直播间海量弹幕与观众流，设计了高性能异步数据处理管道，单机支持百万级用户并发数据的实时解密与监控。
    - 跨平台 GUI：基于 **PySide (Qt for Python)** 开发跨平台桌面应用，实现数据实时可视化看板与多任务异步管理。
    - 开源贡献：项目已在 GitHub 开源（douyinLiveSpider），通过解耦协议层与 UI 层，获得了社区的积极反馈与持续维护。
    - 开源仓库:https://github.com/uamind/douyinLiveSpider
    sub: 刘登

  - title: 指纹浏览器
    duration: 2024年3月 - 2024年4月
    # detail: 使用PySide和PlayWright进行开发, 动态构建浏览器环境, 动态Canvas/WebGL/设备/音频/视频/CPU/GPU...指纹。
    items:
    - 内核级环境伪装：基于 **Playwright** 二次开发，实现在浏览器上下文初始化（`init` 层）动态注入自研 JS 脚本，绕过高级反爬虫的指纹检测。
    - 全维度特征模拟：通过拦截并重写 Web 接口，动态伪装 Canvas、WebGL、WebRTC、AudioContext 以及 CPU/GPU 设备硬件指纹。能够伪装为微信浏览器。
    - 配置驱动：设计了独立的设备配置文件系统，支持一键切换并模拟真实的全球设备环境，极大地降低了账号关联封禁风险。
    sub: 刘登

